name: Daily Stock Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 1-5'

jobs:
  run_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 👇👇👇 重点：完全照抄这一段，一个字母都别改 👇👇👇
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 必须是 notion-client (官方库)，绝对不能是 notion
        pip install requests yfinance notion-client

    # 1. 抓数据
    - name: Run Data Updater
      env:
        FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      run: python update_floats.py

    # 2. 运行主程序
    - name: Run Main Logic
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: python main.py
