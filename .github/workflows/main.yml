name: stock daily-scan

on:
  workflow_dispatch:      # 允许手动点击运行测试
  schedule:
    - cron: '30 23 * * 1-5' # 设定时间：周一到周五 UTC 23:30 (北美盘后)

jobs:
  run-stock-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: 下载代码
        uses: actions/checkout@v2
        
      - name: 安装 Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
          
      - name: 安装依赖库 (关键修复)
        run: |
          pip install -r requirements.txt
          pip install --upgrade notion-client yfinance pandas
          # ↑ 上面这行是救命稻草：强制将 notion-client 升级到官方最新版
        
      - name: 运行脚本
        env: 
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python main.py
