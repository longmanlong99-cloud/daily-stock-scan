name: Daily Stock Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 1-5'

jobs:
  run_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 👇👇👇 之前的罪魁祸首就在这里！👇👇👇
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 以前写的是 notion (错)，现在必须是 notion-client (对)
        pip install requests yfinance notion-client

    # 1. 先抓数据 (制造 JSON)
    - name: Run Data Updater (Firecrawl)
      env:
        FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      run: python update_floats.py

    # 2. 再清理并推送 (读取 JSON)
    - name: Run Main Logic
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: python main.py
