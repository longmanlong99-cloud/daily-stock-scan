name: Daily Stock Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 1-5'

# 核心权限：允许机器人修改代码
permissions:
  contents: write

jobs:
  run_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance

    # 1. 智能抓取 (只抓新股)
    - name: Run Data Updater
      env:
        FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      run: python update_floats.py

    # 2. 保存文件回仓库 (这里修正了命令)
    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 检查 float_data.json 是否有变化
        if [[ -n $(git status --porcelain float_data.json) ]]; then
          git add float_data.json
          git commit -m "📈 Auto-update float data"
          git push
          echo "✅ 数据已保存回仓库"   # 👈 修正点：print 改成了 echo
        else
          echo "✨ 数据无变化，无需提交"
        fi

    # 3. 运行主程序
    - name: Run Main Logic
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: python main.py
