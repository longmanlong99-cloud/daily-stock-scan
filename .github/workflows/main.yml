name: Daily Stock Scan

on:
  workflow_dispatch:  # 允许手动点击运行
  schedule:
    - cron: '30 20 * * 1-5' # 每天收盘后自动运行

jobs:
  run_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 👇👇👇 这里的修改是决定生死的！ 👇👇👇
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 必须是 notion-client，绝对不能写成 notion
        pip install requests yfinance notion-client

    # 先运行搬运工 (抓取 RDW 数据)
    - name: Run Data Updater (Firecrawl)
      env:
        FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      run: python update_floats.py

    # 再运行主程序 (清理重复项 + 推送)
    - name: Run Main Logic
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: python main.py
