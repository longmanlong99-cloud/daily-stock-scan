name: Daily Stock Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '45 21 * * 1-5'

permissions:
  contents: write

jobs:
  run_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # ### CHANGED HERE: 增加了 pandas 和 numpy ###
        pip install requests yfinance pandas numpy

    # 1. 智能抓取 (只抓新股)
    - name: Run Data Updater (Firecrawl)
      env:
        FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      run: python update_floats.py

    # 2. ### CHANGED HERE: 新增步骤 - 慢速抓取 Yahoo 数据 ###
    - name: Run Market Data Fetcher
      run: python fetch_data.py

    # 3. 保存文件回仓库 (同时保存 float_data.json 和 daily_cache.json)
    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # 检查是否有文件变化
        if [[ -n $(git status --porcelain) ]]; then
          git add float_data.json daily_cache.json
          git commit -m "📈 Auto-update market data"
          git push
          echo "✅ 数据已保存回仓库"
        else
          echo "✨ 数据无变化，无需提交"
        fi

    # 4. 运行主程序 (只读本地数据，推送到 Notion)
    - name: Run Main Logic
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: python main.py
