name: stock daily-scan

on:
  workflow_dispatch:      # 允许手动运行
  schedule:
    - cron: '30 23 * * 1-5' # 自动运行时间

jobs:
  run-stock-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: 下载代码 (Checkout)
        uses: actions/checkout@v2
        
      - name: 安装 Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
          
      - name: 强制安装依赖 (Fix Environment)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade notion-client yfinance pandas requests
          # ↑ 这一行是关键！强制服务器下载最新版，不管缓存里有什么旧垃圾
        
      - name: 运行脚本
        env: 
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python main.py
