name: 手动/自动更新基本面数据

on:
  workflow_dispatch: # 允许手动点击运行
  schedule:
    - cron: '0 0 1 * *' # 每月1号自动运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 允许脚本把文件写回仓库

    steps:
      - uses: actions/checkout@v2
      
      - uses: actions/setup-python@v2
        with:
          python-version: '3.9'
          
      - name: 安装依赖
        run: |
          pip install requests
          pip install beautifulsoup4  # 👈 新增：安装网页解析神器

      - name: 运行搬运工
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python update_floats.py
      
      - name: 保存数据到仓库
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add float_data.json
          # 如果有变化就提交，没变化就不报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update float data via Finviz" && git push)
