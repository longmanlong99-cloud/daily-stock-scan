name: 手动/自动更新基本面数据

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # 每月1号自动运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2
      
      - uses: actions/setup-python@v2
        with:
          python-version: '3.9'
          
      - name: 安装依赖
        run: |
          pip install requests
          pip install firecrawl-py  # 👈 这里的关键变化

      - name: 运行搬运工
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python update_floats.py
      
      - name: 保存数据
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add float_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update via Firecrawl" && git push)
